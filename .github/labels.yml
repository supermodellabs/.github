# Org-wide GitHub Issue labels for Supermodel Labs.
#
# Source of truth — synced to every repo under github.com/supermodellabs by
# .github/workflows/sync-labels.yml. Pruning is on, so any label not in this
# list will be deleted from every target repo on the next sync. Edit
# deliberately.
#
# Mirrors the label spec in chezmoi's .utils/provision-repo.ts. Keep them in
# step until provision-repo.ts drops its label pass.

# type
- name: "type: bug"
  color: ea999c
  description: Something isn't working
- name: "type: feature"
  color: ca9ee6
  description: New functionality
- name: "type: docs"
  color: 8caaee
  description: Adding or updating documentation
- name: "type: chore"
  color: babbf1
  description: Maintenance, tooling, deps
- name: "type: refactor"
  color: a6d189
  description: Improving code without affecting functionality

# status
- name: "status: triage"
  color: e5c890
  description: Needs triage
- name: "status: in-progress"
  color: 1d76db
  description: Actively being worked on
- name: "status: blocked"
  color: ef9f76
  description: Blocked by something else
- name: "status: needs-info"
  color: eebebe
  description: Awaiting info from reporter
- name: "status: wontfix"
  color: f2d5cf
  description: This will not be worked on

# meta
- name: good first issue
  color: f4b8e4
  description: Good for newcomers
- name: help wanted
  color: 85c1dc
  description: Extra attention is needed
- name: duplicate
  color: 838ba7
  description: This issue or PR already exists
